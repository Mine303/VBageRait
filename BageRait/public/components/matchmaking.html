<div id="matchmaking" class="fade-in">
  <div id="matchmaking-box" class="slide-up">

    <h1>Matchmaking</h1>

    <div id="matchmaking-options">
      <button class="menu-button" id="quickmatch-btn">Quick Match</button>
      <button class="menu-button" id="private-btn">Private Room</button>
    </div>

    <div id="searching" class="fade-in" style="display:none;">
      <p>Searching for opponent…</p>
      <div class="spinner"></div>
    </div>

    <div id="private-room" style="display:none;">
      <h2>Create or Join Room</h2>

      <input type="text" id="room-code-input" placeholder="Room Code">

      <button class="menu-button" id="create-room-btn">Create Room</button>
      <button class="menu-button" id="join-room-btn">Join Room</button>

      <div id="room-status" class="message-bubble"></div>
    </div>

  </div>
</div>
