<div id="game-container" class="fade-in">

  <header id="ratings-bar" class="slide-up">
    <div class="player-rating" id="playerA-rating">Player A: 1200</div>
    <div class="player-rating" id="playerB-rating">Player B: 1200</div>
  </header>

  <div id="columns" class="slide-up">

    <section id="playerA" class="message-column">
      <h2>Player A</h2>
      <div class="messages" id="messagesA"></div>
    </section>

    <section id="scoreboard">
      <h2>Round Score</h2>
      <div id="round-score"></div>

      <h3>Tilt Meter</h3>
      <div id="tilt-meter">
        <div id="tilt-fill"></div>
      </div>

      <h3>Judge Explanation</h3>
      <div id="judge-explanation"></div>
    </section>

    <section id="playerB" class="message-column">
      <h2>Player B</h2>
      <div class="messages" id="messagesB"></div>
    </section>

  </div>

  <section id="history" class="fade-in">
    <h2>Round History</h2>
    <ul id="history-list"></ul>
  </section>

  <footer id="input-area" class="slide-up">
    <input type="text" id="message-input" placeholder="Type your move…">
    <button id="send-button">Send</button>
  </footer>

</div>
